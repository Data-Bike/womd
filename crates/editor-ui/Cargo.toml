[package]
name = "editor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 UI shell for the WoMD editor (ADR-001)."

[dependencies]
editor-domain = { path = "../editor-domain" }
editor-core = { path = "../editor-core" }
editor-markdown = { path = "../editor-markdown" }
editor-git = { path = "../editor-git" }
editor-diff = { path = "../editor-diff" }
editor-storage = { path = "../editor-storage" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
base64 = "0.23.1"
tauri-plugin-updater = "2.10.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
