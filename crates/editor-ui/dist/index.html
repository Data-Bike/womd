<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoMD — Markdown Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Tab bar -->
    <div id="tab-bar">
      <div id="tab-list"></div>
      <button id="tab-new" title="New tab">+</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <button id="btn-new" title="New (Ctrl+N)">New</button>
      <button id="btn-open" title="Open (Ctrl+O)">Open</button>
      <button id="btn-save" title="Save (Ctrl+S)">Save</button>
      <span class="separator"></span>
      <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      <span class="separator"></span>
      <select id="sel-heading" title="Heading level">
        <option value="0">Normal text</option>
        <option value="1">Heading 1</option>
        <option value="2">Heading 2</option>
        <option value="3">Heading 3</option>
        <option value="4">Heading 4</option>
        <option value="5">Heading 5</option>
        <option value="6">Heading 6</option>
      </select>
      <span class="separator"></span>
      <button id="btn-bold" title="Bold (Ctrl+B)" style="font-weight:bold">B</button>
      <button id="btn-italic" title="Italic (Ctrl+I)" style="font-style:italic">I</button>
      <button id="btn-strike" title="Strikethrough" style="text-decoration:line-through">S</button>
      <button id="btn-code" title="Inline code" style="font-family:monospace">&lt;/&gt;</button>
      <button id="btn-link" title="Link (Ctrl+K)">Link</button>
      <span class="separator"></span>
      <button id="btn-ul" title="Bullet list">• List</button>
      <button id="btn-ol" title="Numbered list">1. List</button>
      <button id="btn-quote" title="Block quote">❝</button>
      <button id="btn-hr" title="Horizontal rule">―</button>
      <button id="btn-codeblock" title="Code block">{ }</button>
      <span class="separator"></span>
      <button id="btn-task" title="Task list">☐</button>
      <span class="separator"></span>
      <button id="btn-tree-toggle" title="Toggle file tree sidebar (Ctrl+Shift+E)">☰</button>
      <button id="btn-view-toggle" title="Toggle Markdown source view (Ctrl+Shift+M)">MD</button>
      <button id="btn-git" title="Toggle Git panel">Git</button>
      <span class="separator"></span>
      <span id="file-name">untitled.md</span>
      <span id="dirty-indicator" class="dirty-dot"></span>
      <span class="spacer"></span>
      <span id="git-branch-info"></span>
      <span class="separator"></span>
      <button id="btn-settings" title="Settings">⚙</button>
    </div>

    <!-- Main area -->
    <div id="main-area">
      <!-- File tree sidebar -->
      <div id="file-tree-panel" class="hidden">
        <div id="file-tree-header">
          <span id="file-tree-root-name">No folder open</span>
          <div id="file-tree-actions">
            <button id="btn-tree-open-folder" title="Open folder as root">📂</button>
            <button id="btn-tree-set-root" title="Set selected folder as root">📁→</button>
            <button id="btn-tree-up" title="Go to parent folder">↑</button>
            <button id="btn-tree-close" title="Close sidebar">×</button>
          </div>
        </div>
        <div id="file-tree-search">
          <input type="text" id="file-tree-filter" placeholder="Filter files..." />
        </div>
        <div id="file-tree-content"></div>
      </div>
      <div id="file-tree-divider" class="hidden"></div>
      <div id="editor-container">
        <div id="block-editor"></div>
      </div>
      <div id="git-divider" class="hidden"></div>
      <div id="git-panel" class="hidden">
        <div id="git-panel-tabs">
          <button class="git-tab active" data-tab="changes">Changes</button>
          <button class="git-tab" data-tab="branches">Branches</button>
          <button class="git-tab" data-tab="history">History</button>
          <button class="git-tab" data-tab="diff">Diff</button>
          <button class="git-tab" data-tab="stash">Stash</button>
          <button class="git-tab" data-tab="tags">Tags</button>
          <button class="git-tab" data-tab="remotes">Remotes</button>
        </div>
        <div id="git-panel-content">
          <div id="git-changes" class="git-section"></div>
          <div id="git-branches" class="git-section hidden"></div>
          <div id="git-history" class="git-section hidden"></div>
          <div id="git-diff" class="git-section hidden"></div>
          <div id="git-stash" class="git-section hidden"></div>
          <div id="git-tags" class="git-section hidden"></div>
          <div id="git-remotes" class="git-section hidden"></div>
        </div>
      </div>
    </div>

    <!-- Context menu (right-click on files in Changes) -->
    <div id="context-menu" class="hidden"></div>

    <!-- File tree context menu -->
    <div id="file-context-menu" class="hidden"></div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <span class="modal-title">Settings</span>
          <button id="settings-close" class="modal-close" title="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="settings-tabs">
            <button class="settings-tab active" data-stab="themes">Themes</button>
            <button class="settings-tab" data-stab="github">GitHub</button>
          </div>
          <div id="settings-themes" class="settings-panel">
            <div class="settings-section-title">Interface Theme</div>
            <div id="theme-grid" class="theme-grid"></div>
            <div class="settings-section-title" style="margin-top:16px">Code Syntax Palette</div>
            <div id="syntax-grid" class="theme-grid"></div>
            <div class="settings-section-title" style="margin-top:16px">Preview</div>
            <div id="theme-preview" class="theme-preview"></div>
          </div>
          <div id="settings-github" class="settings-panel hidden">
            <div class="settings-section-title">GitHub Authentication</div>
            <div id="github-auth-status" class="github-auth-status"></div>
            <div class="github-actions">
              <button id="btn-gh-login" class="git-action-btn">Login with gh CLI</button>
              <button id="btn-gh-refresh" class="git-action-btn">Refresh status</button>
              <button id="btn-gh-logout" class="git-action-btn danger">Logout</button>
            </div>
            <div class="settings-section-title" style="margin-top:16px">Repository</div>
            <div id="github-repo-info" class="github-repo-info"></div>
            <div class="github-actions">
              <button id="btn-gh-prs" class="git-action-btn">Load Pull Requests</button>
              <button id="btn-gh-branches" class="git-action-btn">Load Remote Branches</button>
            </div>
            <div id="github-prs" class="github-prs"></div>
            <div id="github-branches" class="github-branches"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <span class="spacer"></span>
      <span id="block-count">0 blocks</span>
      <span class="separator"></span>
      <span id="autosave-status">Autosave: On</span>
      <span class="separator"></span>
      <span id="encoding">UTF-8</span>
      <span class="separator"></span>
      <span id="line-ending">LF</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
