<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoMD — Markdown Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Tab bar -->
    <div id="tab-bar">
      <div id="tab-list"></div>
      <button id="tab-new" data-i18n-title="tb.new.tab">+</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <button id="btn-new" data-i18n="tb.new" data-i18n-title="tb.new">New</button>
      <button id="btn-open" data-i18n="tb.open" data-i18n-title="tb.open">Open</button>
      <button id="btn-save" data-i18n="tb.save" data-i18n-title="tb.save">Save</button>
      <span class="separator"></span>
      <button id="btn-undo" data-i18n="tb.undo" data-i18n-title="tb.undo">Undo</button>
      <button id="btn-redo" data-i18n="tb.redo" data-i18n-title="tb.redo">Redo</button>
      <span class="separator"></span>
      <select id="sel-heading" data-i18n-title="tb.heading">
        <option value="0" data-i18n-option="tb.heading.normal">Normal text</option>
        <option value="1">Heading 1</option>
        <option value="2">Heading 2</option>
        <option value="3">Heading 3</option>
        <option value="4">Heading 4</option>
        <option value="5">Heading 5</option>
        <option value="6">Heading 6</option>
      </select>
      <span class="separator"></span>
      <button id="btn-bold" data-i18n-title="tb.bold" style="font-weight:bold">B</button>
      <button id="btn-italic" data-i18n-title="tb.italic" style="font-style:italic">I</button>
      <button id="btn-strike" data-i18n-title="tb.strike" style="text-decoration:line-through">S</button>
      <button id="btn-code" data-i18n-title="tb.code" style="font-family:monospace">&lt;/&gt;</button>
      <button id="btn-link" data-i18n="tb.link" data-i18n-title="tb.link">Link</button>
      <span class="separator"></span>
      <button id="btn-ul" data-i18n="tb.ul" data-i18n-title="tb.ul">• List</button>
      <button id="btn-ol" data-i18n="tb.ol" data-i18n-title="tb.ol">1. List</button>
      <button id="btn-quote" data-i18n-title="tb.quote">❝</button>
      <button id="btn-hr" data-i18n-title="tb.hr">―</button>
      <button id="btn-codeblock" data-i18n-title="tb.codeblock">{ }</button>
      <span class="separator"></span>
      <button id="btn-task" data-i18n-title="tb.task">☐</button>
      <span class="separator"></span>
      <button id="btn-tree-toggle" data-i18n-title="tb.tree">☰</button>
      <button id="btn-view-toggle" data-i18n-title="tb.view">MD</button>
      <button id="btn-git" data-i18n="tb.git" data-i18n-title="tb.git">Git</button>
      <span class="separator"></span>
      <span id="file-name">untitled.md</span>
      <span id="dirty-indicator" class="dirty-dot"></span>
      <span class="spacer"></span>
      <span id="git-branch-info"></span>
      <span class="separator"></span>
      <button id="btn-settings" data-i18n-title="tb.settings">⚙</button>
    </div>

    <!-- Main area -->
    <div id="main-area">
      <!-- File tree sidebar -->
      <div id="file-tree-panel" class="hidden">
        <div id="file-tree-header">
          <span id="file-tree-root-name" data-i18n="ft.no.folder">No folder open</span>
          <div id="file-tree-actions">
            <button id="btn-tree-open-folder" data-i18n-title="ft.open.folder">📂</button>
            <button id="btn-tree-set-root" data-i18n-title="ft.set.root">📁→</button>
            <button id="btn-tree-up" data-i18n-title="ft.parent">↑</button>
            <button id="btn-tree-close" data-i18n-title="ft.close">×</button>
          </div>
        </div>
        <div id="file-tree-search">
          <input type="text" id="file-tree-filter" placeholder="Filter files..." data-i18n-placeholder="ft.filter" />
        </div>
        <div id="file-tree-content"></div>
      </div>
      <div id="file-tree-divider" class="hidden"></div>
      <div id="editor-container">
        <div id="block-editor"></div>
      </div>
      <div id="git-divider" class="hidden"></div>
      <div id="git-panel" class="hidden">
        <div id="git-panel-tabs">
          <button class="git-tab active" data-tab="changes" data-i18n="git.changes">Changes</button>
          <button class="git-tab" data-tab="branches" data-i18n="git.branches">Branches</button>
          <button class="git-tab" data-tab="history" data-i18n="git.history">History</button>
          <button class="git-tab" data-tab="diff" data-i18n="git.diff">Diff</button>
          <button class="git-tab" data-tab="stash" data-i18n="git.stash">Stash</button>
          <button class="git-tab" data-tab="tags" data-i18n="git.tags">Tags</button>
          <button class="git-tab" data-tab="remotes" data-i18n="git.remotes">Remotes</button>
        </div>
        <div id="git-panel-content">
          <div id="git-changes" class="git-section"></div>
          <div id="git-branches" class="git-section hidden"></div>
          <div id="git-history" class="git-section hidden"></div>
          <div id="git-diff" class="git-section hidden"></div>
          <div id="git-stash" class="git-section hidden"></div>
          <div id="git-tags" class="git-section hidden"></div>
          <div id="git-remotes" class="git-section hidden"></div>
        </div>
      </div>
    </div>

    <!-- Context menu (right-click on files in Changes) -->
    <div id="context-menu" class="hidden"></div>

    <!-- File tree context menu -->
    <div id="file-context-menu" class="hidden"></div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <span class="modal-title" data-i18n="set.title">Settings</span>
          <button id="settings-close" class="modal-close" data-i18n-title="set.close">×</button>
        </div>
        <div class="modal-body">
          <div class="settings-tabs">
            <button class="settings-tab active" data-stab="themes" data-i18n="set.themes">Themes</button>
            <button class="settings-tab" data-stab="language" data-i18n="set.language">Language</button>
            <button class="settings-tab" data-stab="github" data-i18n="set.github">GitHub</button>
          </div>
          <div id="settings-themes" class="settings-panel">
            <div class="settings-section-title" data-i18n="set.interface.theme">Interface Theme</div>
            <div id="theme-grid" class="theme-grid"></div>
            <div class="settings-section-title" style="margin-top:16px" data-i18n="set.syntax.palette">Code Syntax Palette</div>
            <div id="syntax-grid" class="theme-grid"></div>
            <div class="settings-section-title" style="margin-top:16px" data-i18n="set.preview">Preview</div>
            <div id="theme-preview" class="theme-preview"></div>
          </div>
          <div id="settings-language" class="settings-panel hidden">
            <div class="settings-section-title" data-i18n="set.language">Interface Language</div>
            <div id="language-grid" class="language-grid"></div>
          </div>
          <div id="settings-github" class="settings-panel hidden">
            <div class="settings-section-title" data-i18n="set.gh.auth">GitHub Authentication</div>
            <div id="github-auth-status" class="github-auth-status"></div>
            <div class="github-actions">
              <button id="btn-gh-login" class="git-action-btn" data-i18n="set.gh.login">Login with gh CLI</button>
              <button id="btn-gh-refresh" class="git-action-btn" data-i18n="set.gh.refresh">Refresh status</button>
              <button id="btn-gh-logout" class="git-action-btn danger" data-i18n="set.gh.logout">Logout</button>
            </div>
            <div class="settings-section-title" style="margin-top:16px" data-i18n="set.gh.repo">Repository</div>
            <div id="github-repo-info" class="github-repo-info"></div>
            <div class="github-actions">
              <button id="btn-gh-prs" class="git-action-btn" data-i18n="set.gh.prs">Load Pull Requests</button>
              <button id="btn-gh-branches" class="git-action-btn" data-i18n="set.gh.branches">Load Remote Branches</button>
            </div>
            <div id="github-prs" class="github-prs"></div>
            <div id="github-branches" class="github-branches"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <span class="spacer"></span>
      <span id="block-count">0 blocks</span>
      <span class="separator"></span>
      <span id="autosave-status" data-i18n="status.autosave">Autosave: On</span>
      <span class="separator"></span>
      <span id="encoding">UTF-8</span>
      <span class="separator"></span>
      <span id="line-ending">LF</span>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
