<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WoMD — Markdown Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Tab bar -->
    <div id="tab-bar">
      <div id="tab-list"></div>
      <button id="tab-new" title="New tab">+</button>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
      <button id="btn-new" title="New (Ctrl+N)">New</button>
      <button id="btn-open" title="Open (Ctrl+O)">Open</button>
      <button id="btn-save" title="Save (Ctrl+S)">Save</button>
      <span class="separator"></span>
      <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
      <span class="separator"></span>
      <select id="sel-heading" title="Heading level">
        <option value="0">Normal text</option>
        <option value="1">Heading 1</option>
        <option value="2">Heading 2</option>
        <option value="3">Heading 3</option>
        <option value="4">Heading 4</option>
        <option value="5">Heading 5</option>
        <option value="6">Heading 6</option>
      </select>
      <span class="separator"></span>
      <button id="btn-bold" title="Bold (Ctrl+B)" style="font-weight:bold">B</button>
      <button id="btn-italic" title="Italic (Ctrl+I)" style="font-style:italic">I</button>
      <button id="btn-strike" title="Strikethrough" style="text-decoration:line-through">S</button>
      <button id="btn-code" title="Inline code" style="font-family:monospace">&lt;/&gt;</button>
      <button id="btn-link" title="Link (Ctrl+K)">Link</button>
      <span class="separator"></span>
      <button id="btn-ul" title="Bullet list">• List</button>
      <button id="btn-ol" title="Numbered list">1. List</button>
      <button id="btn-quote" title="Block quote">❝</button>
      <button id="btn-hr" title="Horizontal rule">―</button>
      <button id="btn-codeblock" title="Code block">{ }</button>
      <span class="separator"></span>
      <button id="btn-task" title="Task list">☐</button>
      <span class="separator"></span>
      <button id="btn-git" title="Toggle Git panel">Git</button>
      <span class="separator"></span>
      <span id="file-name">untitled.md</span>
      <span id="dirty-indicator" class="dirty-dot"></span>
      <span class="spacer"></span>
      <span id="git-branch-info"></span>
    </div>

    <!-- Main area -->
    <div id="main-area">
      <div id="editor-container">
        <div id="block-editor"></div>
      </div>
      <div id="git-panel" class="hidden">
        <div id="git-panel-tabs">
          <button class="git-tab active" data-tab="changes">Changes</button>
          <button class="git-tab" data-tab="branches">Branches</button>
          <button class="git-tab" data-tab="history">History</button>
          <button class="git-tab" data-tab="diff">Diff</button>
        </div>
        <div id="git-panel-content">
          <div id="git-changes" class="git-section"></div>
          <div id="git-branches" class="git-section hidden"></div>
          <div id="git-history" class="git-section hidden"></div>
          <div id="git-diff" class="git-section hidden"></div>
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <span class="spacer"></span>
      <span id="block-count">0 blocks</span>
      <span class="separator"></span>
      <span id="autosave-status">Autosave: On</span>
      <span class="separator"></span>
      <span id="encoding">UTF-8</span>
      <span class="separator"></span>
      <span id="line-ending">LF</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
