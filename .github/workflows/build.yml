name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundle-ext: deb
          - platform: windows-latest
            bundle-ext: msi

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/editor-ui/package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: crates/editor-ui
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/editor-ui

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/editor-ui
          args: --verbose

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: womd-${{ matrix.platform }}-${{ matrix.bundle-ext }}
          path: |
            target/release/bundle/*/*.${{ matrix.bundle-ext }}
            target/release/bundle/**/*.${{ matrix.bundle-ext }}
